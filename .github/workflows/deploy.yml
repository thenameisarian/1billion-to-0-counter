name: Deploy to Cloudflare Pages

# Every push to main automatically publishes the counter.
# No manual zip upload ever again.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage the site and inject the YouTube API key
        run: |
          mkdir dist
          sed "s|__YT_API_KEY__|${{ secrets.YT_API_KEY }}|g" index.html > dist/index.html

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Deploys to the existing "1billionto0" project,
          # which already serves counter.mustafaarian.com.
          command: pages deploy dist --project-name=1billionto0 --branch=main
